# news-tracker profile config. Model lines match the host's default profile;
# change them if this agent should run on a different model.
model:
  default: gemini-3.6-flash
  provider: gemini

plugins:
  enabled:
    - filament-fcm

# Connectors. Particle.pro = podcast intelligence (100k+ transcribed shows).
# Key comes from the profile's .env as PARTICLE_API_KEY. Without it the
# server returns 401 and the skills fall back to social + web only.
mcp_servers:
  particle:
    url: "https://mcp.particle.pro"
    headers:
      X-API-Key: "${PARTICLE_API_KEY}"
    timeout: 60
    connect_timeout: 20
    # Only the four tools the pack uses. Every registered tool's schema goes into
    # every prompt, so the other 22 are pure context cost (and temptation).
    tools:
      include:
        - particle_entity_resolve
        - particle_podcast_find_mentions
        - particle_podcast_search_transcripts
        - particle_podcast_get_episode
      prompts: false
      resources: false

# The post-turn self-improvement review may propose new skills from a conversation.
# Stage them for approval instead of letting them land silently: this agent's
# behaviour is the pack's skills, and an auto-minted skill from one chat has
# already derailed a session once (agentic-skill-discovery, 27 Aug).
skills:
  write_approval: true

cron:
  model_drift_guard: true
  # Deliver the brief itself, not Hermes's "Cronjob Response… To stop or manage this job…" wrapper.
  wrap_response: false
